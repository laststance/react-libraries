name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify catalog and site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned package manager and dependencies
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile
      - name: Check types and project configuration
        run: |
          pnpm run check
          pnpm run doctor
          pnpm run validate
      - name: Build pages and the search index
        run: pnpm run build
      - name: Ensure generated pages match the catalog
        run: |
          git diff --exit-code -- docs
          if [ -n "$(git ls-files --others --exclude-standard -- docs)" ]; then
            git ls-files --others --exclude-standard -- docs
            exit 1
          fi
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify migration coverage and browser journeys
        run: pnpm test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            test-results/
            qa/*.png
          retention-days: 7
