# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!migration/notion/**"
    - "!migration/sources/**"
    - "!docs/**"
    - "!pnpm-lock.yaml"
